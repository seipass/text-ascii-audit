[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-ascii-audit"
version = "1.0.0"
description = "Report non-ASCII characters with their positions."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "seipass"}]

[project.scripts]
text-ascii-audit = "text_ascii_audit:main"

[tool.setuptools]
py-modules = ["text_ascii_audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
